<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мастерская Вестмора</title>
<meta name="description" content="Библиотека сценариев для Pax Historia по эпохам и фронтам">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="Мастерская Вестмора">
<meta property="og:title" content="Мастерская Вестмора · Писать историю своими руками">
<meta property="og:description" content="Библиотека сценариев для Pax Historia по эпохам и фронтам">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&amp;family=EB+Garamond:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#eadfc9;--ink:#2a1414;--mut:#6b5846;--gold:#b48b52;--bur:#4a1418;--acc:#7a1218;--card:#f3ead7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1714;--ink:#eadfc9;--mut:#ae9c84;--gold:#c9a063;--bur:#3a0f13;--acc:#e08a7f;--card:#271f1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1714;--ink:#eadfc9;--mut:#ae9c84;--gold:#c9a063;--bur:#3a0f13;--acc:#e08a7f;--card:#271f1a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:18px/1.6 "EB Garamond",Georgia,serif;
background:radial-gradient(circle at 15% 8%,rgba(255,255,255,.28),transparent 40%),radial-gradient(circle at 85% 92%,rgba(120,80,30,.14),transparent 45%),var(--bg);min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:22px 20px 0}
.sc{font-family:"Cormorant SC",Georgia,serif}
.ban{position:relative;background:var(--bur);border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);padding:18px 20px 12px;text-align:center;box-shadow:inset 0 0 0 5px var(--bur),inset 0 0 0 6px var(--gold)}
.ban h1{margin:0;font:700 clamp(26px,5vw,50px)/1.1 "Cormorant SC",Georgia,serif;color:#e0c48f;letter-spacing:.02em;cursor:pointer}
.bs{margin-top:8px;color:#eadfc9;font:500 clamp(11px,1.8vw,16px) "Cormorant SC",Georgia,serif;letter-spacing:.38em;text-transform:uppercase;border-top:1px solid var(--gold);padding-top:8px}
.page{display:grid;grid-template-columns:1fr 190px;gap:0;padding-top:30px}
main{min-width:0;padding-right:34px}
.side{border-left:3px double var(--gold);padding:6px 0 6px 28px;display:flex;flex-direction:column;gap:20px;align-self:start;position:sticky;top:20px}
.side a{font:600 18px "Cormorant SC",Georgia,serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);cursor:pointer;text-decoration:none}
.side a:hover,.side a.on{color:var(--acc)}
.side .who{font-size:13px;color:var(--mut);font-style:italic}
.hero{text-align:center;padding:14px 0 6px}
.hero h2{margin:0;font:600 clamp(30px,6.4vw,66px)/1.12 "Cormorant SC",Georgia,serif;letter-spacing:.07em;text-transform:uppercase}
.hero p{margin:22px 0 0;font-style:italic;font-size:clamp(19px,2.6vw,28px);color:var(--acc);letter-spacing:.04em}
.hr{border:0;border-top:2px solid var(--gold);margin:26px 0}
.sec{font:600 20px "Cormorant SC",Georgia,serif;letter-spacing:.3em;text-transform:uppercase;text-align:center;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);background:rgba(180,139,82,.14);padding:8px 0;margin:30px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px}
.card{background:var(--card);border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 8px 20px -10px rgba(40,20,5,.5);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.cv{aspect-ratio:16/10;position:relative;display:grid;place-items:center;background:linear-gradient(135deg,#6b2a2a,#2b1a14);overflow:hidden}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ct{position:relative;width:100%;text-align:center;padding:12px 10px;background:linear-gradient(90deg,transparent,rgba(20,10,5,.62) 15%,rgba(20,10,5,.62) 85%,transparent);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.ct b{display:block;font:700 clamp(19px,2.4vw,26px)/1.15 "Cormorant SC",Georgia,serif;letter-spacing:.08em;text-transform:uppercase}
.ct span{font:600 17px "Cormorant SC",Georgia,serif;letter-spacing:.1em;text-transform:uppercase}
.cap{text-align:center;font-style:italic;font-size:17px;padding:7px 8px 9px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.chip{font:600 15px "Cormorant SC",Georgia,serif;letter-spacing:.06em;border:1px solid var(--gold);background:transparent;color:var(--ink);padding:5px 14px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--bur);color:#e0c48f;border-color:var(--bur)}
.auth{display:flex;flex-wrap:wrap;justify-content:center;gap:26px 34px;padding:10px 0 34px}
.au{width:130px;text-align:center;cursor:pointer}
.av{width:104px;height:104px;border-radius:50%;margin:0 auto 8px;border:3px solid var(--gold);box-shadow:0 0 0 3px var(--card),0 6px 12px -4px rgba(0,0,0,.5);overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#6b2a2a,#2b1a14);color:#e0c48f;font:700 40px "Cormorant SC",serif}
.av img{width:100%;height:100%;object-fit:cover}
.au b{display:block;font-weight:600;line-height:1.2}
.au i{font-size:15px;color:var(--mut)}
.btn{font:700 16px "Cormorant SC",Georgia,serif;letter-spacing:.06em;cursor:pointer;border:1px solid var(--bur);background:transparent;color:var(--ink);padding:9px 20px;border-radius:6px}
.btn:hover{background:var(--bur);color:#e0c48f}
.btn.pri{background:var(--bur);color:#e0c48f}
.btn.pri:hover{filter:brightness(1.3)}
.btn:disabled{opacity:.5;cursor:wait}
.empty{text-align:center;color:var(--mut);padding:30px 0 50px;font-style:italic}
.art{max-width:720px;margin:0 auto;padding-bottom:50px}
.art h2{font:700 clamp(30px,5vw,52px)/1.1 "Cormorant SC",Georgia,serif;letter-spacing:.04em;margin:20px 0 8px;text-transform:uppercase}
.by{font-style:italic;color:var(--mut);margin-bottom:16px}
.hc{width:100%;max-height:420px;object-fit:cover;border-radius:10px;margin:6px 0 18px;cursor:zoom-in;box-shadow:0 8px 20px -10px rgba(40,20,5,.5)}
.txt p{margin:0 0 1em;font-size:20px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:22px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in}
.lnks{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.lnks a{font:700 16px "Cormorant SC",Georgia,serif;letter-spacing:.05em;color:#e0c48f;background:var(--bur);padding:8px 16px;border-radius:6px;text-decoration:none}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.bot{height:38px;background:var(--bur);border-top:3px solid var(--gold);margin-top:20px}
.ov{position:fixed;inset:0;background:rgba(15,8,4,.65);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) 14px 30px;z-index:20;display:grid;place-items:start center}
.box{background:var(--card);border:2px solid var(--gold);border-radius:12px;width:min(640px,100%);padding:22px;margin-top:3vh}
.box h3{margin:0 0 4px;font:700 28px "Cormorant SC",serif;letter-spacing:.05em}
label{display:block;font:600 15px "Cormorant SC",serif;letter-spacing:.1em;color:var(--mut);margin:13px 0 4px;text-transform:uppercase}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--gold);padding:9px 11px;border-radius:6px}
textarea{min-height:80px;resize:vertical}textarea.big{min-height:210px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.th{position:relative;width:84px;height:62px}
.th img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.th b{position:absolute;top:-7px;right:-7px;background:var(--bur);color:#e0c48f;width:20px;height:20px;border-radius:50%;text-align:center;line-height:20px;font-size:13px;cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:30;cursor:zoom-out}
.lb img{max-width:94vw;max-height:92vh}
.note{font-size:15px;color:var(--mut);font-style:italic}
.gate{text-align:center;max-width:460px;margin:40px auto 60px;padding:0 10px}.gate h2{font:700 34px "Cormorant SC",serif;letter-spacing:.06em;margin:0 0 6px}.gate p{margin:0 0 18px}.gate input{margin:14px 0 10px;width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:1px solid var(--gold);padding:10px 12px;border-radius:6px;text-align:center}
@media (max-width:780px){
 .ban{padding:16px 12px 10px}.bs{letter-spacing:.18em}
 .page{display:flex;flex-direction:column;padding-top:16px}
 main{padding-right:0}
 .side{order:-1;position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px 20px;border:0;border-bottom:2px solid var(--gold);padding:0 0 12px;margin-bottom:10px;width:100%}
 .side a{font-size:16px}
}
@keyframes fi{from{opacity:0;transform:translateY(14px)}}
.card{animation:fi .55s ease backwards;animation-delay:calc(var(--i,0)*70ms)}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.lg{display:block;margin:0 auto 8px;max-height:84px;max-width:80%;object-fit:contain}
.bd{position:absolute;top:8px;left:8px;z-index:1;background:var(--bur);color:#e0c48f;font:700 13px "Cormorant SC",serif;letter-spacing:.08em;padding:3px 10px;border-radius:99px;text-transform:uppercase}
.pin .cv{outline:3px solid var(--gold);outline-offset:-3px}
.tg{text-align:center;font-size:14px;color:var(--mut);padding:0 8px 10px}
.meta{margin-top:14px;color:var(--mut);font-style:italic;font-size:17px}
.ck{display:flex;gap:8px;align-items:center;font:inherit;letter-spacing:0;text-transform:none;color:var(--ink);margin:12px 0 0}.ck input{width:auto}
.q{margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap}.q input{flex:1;min-width:200px}
select{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--gold);padding:9px 11px;border-radius:6px}
.tl{border-left:3px double var(--gold);padding-left:24px;margin-left:6px}
.te h3{position:relative;margin:26px 0 14px;font:700 28px "Cormorant SC",serif;letter-spacing:.06em}
.te h3:before{content:"";position:absolute;left:-35px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--gold)}
.bk{font-size:13px;color:var(--mut);font-style:italic}.bk.old{color:var(--acc)}
</style>

<script type="application/json" id="state">{"title":"Мастерская Вестмора","hero":"Писать историю своими руками","tagline":"Библиотека сценариев по эпохам и фронтам","upd":"2026-10-18","items":[{"id":"smvdj5y6c","aid":"","author":"Егор Рене","role":"","pic":"","title":"Republic of Westmor","era":"2026","summary":"Вестмор, 1 января 2026. Ты просыпаешься с паспортом, аттестатом и долларами в кармане. Дальше только твой выбор и твоя удача. Сделай первый шаг.","body":"СЦЕНАРИЙ: ВЕСТМОР, 1 ЯНВАРЯ 2026\nТы просыпаешься в своей комнате. Где именно — покажет бросок.\nНа календаре первый день года, но праздновать особенно нечего. В Безарополисе салюты, в Рублёвке фейерверки, в Гостксе пьют по подъездам, в Егединово легли спать в десять.\nТвоя жизнь начинается сегодня. Не с понедельника, не с первого числа — просто совпало.\nУ тебя есть паспорт. Есть аттестат с оценками, которые выпали тебе, а не которые ты заслужил. Есть семья, город, улица, соседи. Есть доллары в кармане — сколько, зависит от того, кто твои родители.\nДальше — твой выбор и твоя удача.\nКто-то через двадцать лет будет стоять у окна в Кремле, глядя на ту же страну сверху. Кто-то замёрзнет в трущобах. Кто-то выведет свой бизнес в порт Сталейска. Кто-то всю жизнь проработает на заводе в Гостксе и умрёт от сердца в пятьдесят.\nРазница между ними — в десятке бросков, трёх правильных решениях и одном случайном знакомстве.\nВестмор не даёт гарантий. Он даёт шанс. Один. Потом ещё один. И ещё.\nПока они не кончатся. Или пока ты не возьмёшь своё.\nСделай первый шаг.","links":["https://www.paxhistoria.co/presets/0N4tZvZNGmOuAe7SQDZJ?versionID=8"],"cover":"782401cfa3e794397ea35fdd344515c4","gallery":["4a9dbd42dd969805c159101e47579cd9"],"tags":["обычная жизнь","карьерный рост"],"dr":false,"pin":false,"date":"18.10.2026"}],"logo":"","inline":{"782401cfa3e794397ea35fdd344515c4":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAA <script>
const S=JSON.parse(document.getElementById('state').textContent);
const app=document.getElementById('app');
function setTheme(t){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}
try{const t=localStorage.getItem('vm_theme');if(t)setTheme(t)}catch(_){}
let isOwner=false,canPost=false,uid='',assets=null,artifact=null,dl=null,role='',view=null,tab='home',draft=null,busy=false,flt='',fe='',ft='',q='',rest=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img=id=>(S.inline&&S.inline[id])||'/_blob/'+id;
const mayEdit=it=>canPost;
const vis=()=>S.items.filter(x=>canPost||!x.dr);
const tgs=x=>x.tags||[];
const pl=(n,a)=>a[n%10==1&&n%100!=11?0:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?1:2];
const yr=e=>{const m=String(e).match(/\d{3,4}/);return m?(/до н/i.test(e)?-1:1)*+m[0]:1e9};
const dk=()=>'vm_d_'+(draft&&draft.id||'new');
function sv(){if(draft)try{localStorage.setItem(dk(),JSON.stringify(draft))}catch(_){}}
function ld(){rest=false;try{const o=JSON.parse(localStorage.getItem(dk())||'null');if(o&&typeof o==='object'){draft={...draft,...o};rest=true}}catch(_){}}
function clr(){try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}}
function hc(){const h=location.hash.slice(1);view=S.items.some(x=>x.id===h)?h:null}
function bkH(){let t=0;try{t=+localStorage.getItem('vm_bk')||0}catch(_){}if(!t)return'<span class="bk old">резервных копий ещё не было</span>';const n=Math.floor((Date.now()-t)/864e5);return `<span class="bk${n>=7?' old':''}">последняя копия была ${n?n+' '+pl(n,['день','дня','дней'])+' назад':'сегодня'}</span>`}
function lgH(){const s=q.trim().toLowerCase();const l=vis().filter(x=>(!flt||x.author===flt)&&(!fe||x.era===fe)&&(!ft||tgs(x).includes(ft))&&(!s||[x.title,x.summary,x.body,x.era,x.author,...tgs(x)].join(' ').toLowerCase().includes(s)));return l.length?`<div class="grid">${l.map(cardH).join('')}</div>`:'<div class="empty">Ничего не найдено.</div>'}
function lk(s){const p=String(s).split('|');const u=(p.length>1?p.slice(1).join('|'):p[0]).trim();if(!/^https?:\/\//i.test(u))return'';let l=p.length>1?p[0].trim():'';if(!l){try{l=new URL(u).hostname}catch(_){l=u}}return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(l)} ↗</a>`}
function authors(){const m={};[...vis()].reverse().forEach(x=>{if(!x.author)return;const a=m[x.author]=m[x.author]||{name:x.author,n:0};a.n++;if(x.pic)a.pic=x.pic;if(x.role)a.role=x.role});return Object.values(m)}
const cardH=(x,i=0)=>`<article class="card${x.pin?' pin':''}" style="--i:${Math.min(i,8)}" data-act="open" data-id="${x.id}"><div class="cv">${x.cover?`<img src="${img(x.cover)}" alt="" loading="lazy">`:''}${x.dr?'<span class="bd">Черновик</span>':x.pin?'<span class="bd">Закреплён</span>':''}<div class="ct"><b>${esc(x.title)}</b><span>${esc(x.era)}</span></div></div><div class="cap">автор: ${esc(x.author||'—')}</div>${tgs(x).length?`<div class="tg">${tgs(x).map(t=>'#'+esc(t)).join(' ')}</div>`:''}</article>`;
function authH(){const A=authors();if(!A.length)return'';return `<div class="sec" id="authors">Авторы мастерской</div><div class="auth">${A.map(a=>`<div class="au" data-act="byauth" data-a="${esc(a.name)}"><div class="av">${a.pic?`<img src="${img(a.pic)}" alt="">`:esc(a.name.trim().charAt(0).toUpperCase())}</div><b>${esc(a.name)}</b><i>${esc(a.role||'Автор · '+a.n)}</i></div>`).join('')}</div>`}
function gate(){
  app.innerHTML=`<div class="wrap"><div class="ban"><h1>${esc(S.title)}</h1><div class="bs">Сценарии · Авторы · История</div></div>
  <div class="gate"><h2>Добро пожаловать</h2><p>Как ты хочешь войти?</p>
  <div class="row" style="justify-content:center"><button class="btn pri" data-act="g-view">Зритель</button><button class="btn" data-act="g-adm">Главный админ</button></div>
  <div id="pw" style="display:none"><input type="password" id="pwi" placeholder="Пароль" autocomplete="current-password"><button class="btn pri" data-act="g-ok">Войти</button><p class="note" id="gm"></p></div></div></div><div id="modal"></div>`;
}
function render(){
  if(!role){gate();return}
  const V=vis(),it=V.find(x=>x.id===view);
  let m='';
  if(it){
    m=`<div class="art"><button class="btn" data-act="back">← Назад</button><h2>${esc(it.title)}</h2>
    <div class="by">автор: ${esc(it.author||'—')} · ${esc(it.era)} · ${esc(it.date||'')}${it.dr?' · черновик':''}</div>
    ${it.cover?`<img class="hc" src="${img(it.cover)}" alt="" data-act="zoom" data-src="${img(it.cover)}">`:''}
    <div class="txt">${esc(it.body||it.summary).split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')}</div>
    ${(it.gallery||[]).length?`<div class="gal">${it.gallery.map(g=>`<img src="${img(g)}" alt="" loading="lazy" data-act="zoom" data-src="${img(g)}">`).join('')}</div>`:''}
    ${(it.links||[]).map(lk).join('')?`<div class="lnks">${it.links.map(lk).join('')}</div>`:''}
    ${tgs(it).length?`<div class="chips" style="justify-content:flex-start;margin:20px 0 0">${tgs(it).map(t=>`<button class="chip" data-act="tagf" data-a="${esc(t)}">#${esc(t)}</button>`).join('')}</div>`:''}
    <div class="row"><button class="btn" data-act="copy" data-id="${it.id}">Скопировать ссылку</button>${mayEdit(it)?`<button class="btn" data-act="edit" data-id="${it.id}">Редактировать</button>`:''}</div></div>`;
  }else if(tab==='lib'){
    const names=[...new Set(V.map(x=>x.author).filter(Boolean))],eras=[...new Set(V.map(x=>x.era).filter(e=>e&&e!=='—'))].sort((a,b)=>yr(a)-yr(b)),tags=[...new Set(V.flatMap(tgs))];
    if(flt&&!names.includes(flt))flt='';if(fe&&!eras.includes(fe))fe='';if(ft&&!tags.includes(ft))ft='';
    const ch=(arr,cur,act,all,pre)=>arr.length?`<div class="chips">${['',...arr].map(a=>`<button class="chip${a===cur?' on':''}" data-act="${act}" data-a="${esc(a)}">${a?pre+esc(a):all}</button>`).join('')}</div>`:'';
    m=`<div class="hero"><h2 style="font-size:clamp(28px,5vw,48px)">Библиотека</h2><p>${esc(S.tagline)}</p></div><hr class="hr">
    <div class="q"><input type="text" id="q" placeholder="Поиск по названию и тексту" value="${esc(q)}">${eras.length?`<select id="fe"><option value="">Все эпохи</option>${eras.map(e=>`<option value="${esc(e)}"${e===fe?' selected':''}>${esc(e)}</option>`).join('')}</select>`:''}</div>
    ${names.length>1?ch(names,flt,'flt','Все авторы',''):''}${ch(tags,ft,'tagf','Все теги','#')}
    <div id="lg">${V.length?lgH():'<div class="empty">Здесь пока нет сценариев.</div>'}</div>`;
  }else if(tab==='time'){
    const g={};V.forEach(x=>(g[x.era||'—']=g[x.era||'—']||[]).push(x));
    const ks=Object.keys(g).sort((a,b)=>yr(a)-yr(b)||a.localeCompare(b));
    m=`<div class="hero"><h2 style="font-size:clamp(28px,5vw,48px)">Лента времени</h2><p>Сценарии по эпохам</p></div><hr class="hr">
    ${ks.length?`<div class="tl">${ks.map(k=>`<section class="te"><h3>${esc(k)}</h3><div class="grid">${g[k].map(cardH).join('')}</div></section>`).join('')}</div>`:'<div class="empty">Здесь пока нет сценариев.</div>'}`;
  }else{
    const pn=V.find(x=>x.pin),sh=[...(pn?[pn]:[]),...V.filter(x=>x!==pn).slice(0,4)];
    const up=S.upd?new Date(S.upd+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):'';
    m=`<div class="hero"><h2>${esc(S.hero||'')}</h2><p>${esc(S.tagline)}</p><div class="meta">Сценариев: ${V.length}${up?' · Обновлено '+up:''}</div></div><hr class="hr">
    ${V.length?`<div class="grid">${sh.map(cardH).join('')}</div>${V.length>sh.length?'<div class="row" style="justify-content:center"><button class="btn" data-act="nav" data-t="lib">Вся библиотека</button></div>':''}`:`<div class="empty">${canPost?'Нажми «Новый сценарий» справа и опубликуй первый.':'Первые сценарии скоро появятся.'}</div>`}
    ${authH()}`;
  }
  const nv=(t,l)=>`<a class="${!it&&tab===t?'on':''}" data-act="nav" data-t="${t}">${l}</a>`,adm=role==='admin';
  const side=nv('home','Главная')+nv('lib','Библиотека')+nv('time','Лента времени')+'<a data-act="nav" data-t="authors">Авторы</a>'+(canPost?'<a data-act="new">+ Новый сценарий</a>':'')
   +`<a data-act="theme">${document.documentElement.dataset.theme==='dark'?'☀ Светлая тема':'☾ Тёмная тема'}</a>`
   +(adm?(dl?'<a data-act="dl">Скачать копию</a><a data-act="dl" data-p="1">Копия для GitHub</a>':'')+(assets?`<a data-act="logo">Логотип</a>${S.logo?'<a data-act="nologo">Убрать логотип</a>':''}`:'')+bkH()+'<a data-act="logout">Выйти</a><span class="who">главный админ'+(artifact?'':' · публикация недоступна')+'</span>':(S.pub?'':'<a data-act="logout">Вход для админа</a>'));
  app.innerHTML=`<div class="wrap"><div class="ban">${S.logo?`<img class="lg" src="${img(S.logo)}" alt="">`:''}<h1 data-act="nav" data-t="home">${esc(S.title)}</h1><div class="bs">Сценарии · Авторы · История</div></div>
  <div class="page"><main>${m}</main><nav class="side">${side}</nav></div></div><div class="bot"></div><input type="file" id="lgi" accept="image/*" hidden data-up="logo"><div id="modal"></div>`;
  scrollTo(0,0);
}
function form(){
  const d=draft;
  document.getElementById('modal').innerHTML=`<div class="ov"><div class="box"><h3>${d.isNew?'Новый сценарий':'Редактирование'}</h3>
  <label>Имя автора</label><input type="text" data-f="author" value="${esc(d.author)}" placeholder="Как тебя подписать">
  <label>Роль автора (необязательно)</label><input type="text" data-f="role" value="${esc(d.role)}" placeholder="Хронограф, редактор…">
  <label>Фото автора (необязательно)</label><input type="file" accept="image/*" data-up="pic"><div class="thumbs" id="pp"></div>
  <label>Название</label><input type="text" data-f="title" value="${esc(d.title)}" placeholder="Война на севере">
  <label>Эпоха / год</label><input type="text" data-f="era" value="${esc(d.era)}" placeholder="1812 год">
  <label>Теги (через запятую)</label><input type="text" data-f="tags" value="${esc(d.tags)}" placeholder="война, Европа, альт-история"><label>Короткое описание</label><textarea data-f="summary">${esc(d.summary)}</textarea>
  <label>Полный текст сценария</label><textarea class="big" data-f="body">${esc(d.body)}</textarea>
  <label>Ссылки (по одной в строке: Название | https://адрес)</label><textarea data-f="links" placeholder="Скачать сценарий | https://...">${esc(d.links)}</textarea>
  <label>Обложка</label><input type="file" accept="image/*" data-up="cover"><div class="thumbs" id="pc"></div>
  <label>Дополнительные фото</label><input type="file" accept="image/*" multiple data-up="gallery"><div class="thumbs" id="pg"></div>
  <label class="ck"><input type="checkbox" data-f="dr" ${d.dr?'checked':''}> Черновик (зрители не видят)</label><label class="ck"><input type="checkbox" data-f="pin" ${d.pin?'checked':''}> Закрепить наверху главной</label><p class="note" id="msg">${rest?'Восстановлен автосохранённый текст.':assets?'':'Загрузка фото недоступна.'}</p>
  <div class="row"><button class="btn pri" data-act="publish">Опубликовать</button><button class="btn" data-act="cancel">Отмена</button>${d.isNew?'':'<button class="btn" data-act="del" style="margin-left:auto">Удалить</button>'}</div></div></div>`;
  photos();
}
function photos(){
  const t=(id,k,i)=>`<div class="th"><img src="${img(id)}" alt=""><b data-act="rm" data-k="${k}" data-i="${i}">×</b></div>`;
  document.getElementById('pp').innerHTML=draft.pic?t(draft.pic,'pic',0):'';
  document.getElementById('pc').innerHTML=draft.cover?t(draft.cover,'cover',0):'';
  document.getElementById('pg').innerHTML=draft.gallery.map((g,i)=>t(g,'gallery',i)).join('');
}
function buildHtml(inl,pub){
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#app').innerHTML='';c.setAttribute('data-theme','dark');c.style.colorScheme='dark';
  const o={...S};if(inl)o.inline=inl;if(pub){o.pub=1;o.items=S.items.filter(x=>!x.dr)}
  c.querySelector('#state').textContent=JSON.stringify(o).replace(/</g,'\\u003c');
  let h='<!doctype html>\n'+c.outerHTML;if(pub)h=h.split(HASH).join('off');return h}
async function persist(){S.upd=new Date().toISOString().slice(0,10);await artifact.publish(buildHtml());
}
function toData(id){return new Promise(res=>{const i=new Image();i.onload=()=>{try{const k=Math.min(1,1600/Math.max(i.naturalWidth,i.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(i.naturalWidth*k);c.height=Math.round(i.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.85))}catch(_){res('')}};i.onerror=()=>res('');i.src='/_blob/'+id})}
async function doDownload(el,pub){const t=el.textContent;el.textContent='Собираю файл…';try{const L=pub?S.items.filter(x=>!x.dr):S.items,ids=new Set(),inl={};L.forEach(x=>{[x.cover,x.pic,...(x.gallery||[])].forEach(i=>i&&ids.add(i))});if(S.logo)ids.add(S.logo);for(const id of ids){const d=await toData(id);if(d)inl[id]=d}await dl.save({filename:pub?'index.html':'vestmora.html',data:buildHtml(inl,pub)});if(!pub){try{localStorage.setItem('vm_bk',Date.now())}catch(_){}}}catch(_){}el.textContent=t;if(!pub)render()}
function say(t){const m=document.getElementById('msg');if(m)m.textContent=t}
app.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){q=t.value;const g=document.getElementById('lg');if(g)g.innerHTML=lgH();return}const f=t.dataset&&t.dataset.f;if(f&&draft){draft[f]=t.type==='checkbox'?t.checked:t.value;sv()}});
app.addEventListener('change',async e=>{
  if(e.target.id==='fe'){fe=e.target.value;render();return}
  const k=e.target.dataset&&e.target.dataset.up;if(!k||!assets)return;
  if(k==='logo'){if(!artifact){alert('Публикация недоступна: открой сайт внутри Claude под своим аккаунтом.');return}try{const r=await assets.upload(e.target.files[0]);S.logo=r.id;await persist()}catch(err){alert('Не удалось: '+(err&&err.message||err))}e.target.value='';return}
  say('Загружаю фото…');
  try{for(const f of e.target.files){const r=await assets.upload(f);if(k==='gallery')draft.gallery.push(r.id);else draft[k]=r.id}say('Готово.');sv()}
  catch(err){say('Не удалось загрузить: '+(err&&err.message||err))}
  e.target.value='';photos();
});
app.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='g-view'){role='viewer';try{sessionStorage.setItem('vm_role','viewer')}catch(_){}render()}
  else if(a==='g-adm'){document.getElementById('pw').style.display='block';document.getElementById('pwi').focus()}
  else if(a==='g-ok'){await tryPw()}
  else if(a==='logout'){role='';canPost=false;view=null;try{localStorage.removeItem('vm_adm');sessionStorage.removeItem('vm_role')}catch(_){}render()}
  else if(a==='dl'){if(role==='admin'&&dl)await doDownload(el,el.dataset.p)}
  else if(a==='open'){view=id;try{history.replaceState(null,'','#'+id)}catch(_){}render()}
  else if(a==='back'){clr();view=null;render()}
  else if(a==='nav'){clr();view=null;const t=el.dataset.t;if(t==='authors'){tab='home';render();const x=document.getElementById('authors');if(x)x.scrollIntoView({behavior:'smooth'})}else{if(t==='lib')flt=fe=ft=q='';tab=t;render()}}
  else if(a==='byauth'){flt=el.dataset.a;tab='lib';view=null;render()}
  else if(a==='flt'){flt=el.dataset.a;render()}
  else if(a==='zoom'){const l=document.createElement('div');l.className='lb';l.innerHTML=`<img src="${esc(el.dataset.src)}" alt="">`;l.onclick=()=>l.remove();document.getElementById('modal').appendChild(l)}
  else if(a==='theme'){const t=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(t);try{localStorage.setItem('vm_theme',t)}catch(_){}el.textContent=t==='dark'?'☀ Светлая тема':'☾ Тёмная тема'}
  else if(a==='copy'){const u=location.href.split('#')[0]+'#'+id;try{await navigator.clipboard.writeText(u);el.textContent='Ссылка скопирована ✓'}catch(_){prompt('Скопируй ссылку:',u)}}
  else if(a==='tagf'){ft=el.dataset.a;view=null;clr();tab='lib';render()}
  else if(!canPost)return;
  else if(a==='logo'){document.getElementById('lgi').click()}
  else if(a==='nologo'){if(!artifact)return;S.logo='';await persist()}
  else if(a==='new'){let n='';try{n=localStorage.getItem('vm_author')||''}catch(_){}
    draft={isNew:true,author:n,role:'',pic:'',title:'',era:'',summary:'',body:'',links:'',cover:'',gallery:[],tags:'',dr:false,pin:false};ld();form()}
  else if(a==='edit'){const x=S.items.find(i=>i.id===id);draft={...x,role:x.role||'',pic:x.pic||'',gallery:[...(x.gallery||[])],links:(x.links||[]).join('\n'),tags:tgs(x).join(', ')};ld();form()}
  else if(a==='cancel'){draft=null;document.getElementById('modal').innerHTML=''}
  else if(a==='rm'){const k=el.dataset.k;if(k==='gallery')draft.gallery.splice(+el.dataset.i,1);else draft[k]='';photos()}
  else if(a==='del'){if(!artifact){say('Публикация недоступна: открой сайт внутри Claude под своим аккаунтом.');return}if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Точно удалить?';return}
    S.items=S.items.filter(i=>i.id!==draft.id);try{localStorage.removeItem(dk())}catch(_){}view=null;await send(el)}
  else if(a==='publish'){
    if(!artifact){say('Публикация недоступна: открой сайт внутри Claude под своим аккаунтом, а не по общей ссылке.');return}
    if(!draft.title.trim()){say('Нужно название.');return}
    if(!draft.author.trim()){say('Укажи имя автора.');return}
    try{localStorage.setItem('vm_author',draft.author.trim())}catch(_){}
    const o={id:draft.id||('s'+Date.now().toString(36)),aid:draft.aid||uid,author:draft.author.trim(),role:draft.role.trim(),pic:draft.pic,title:draft.title.trim(),era:draft.era.trim()||'—',summary:draft.summary.trim(),body:draft.body.trim(),
      links:draft.links.split('\n').map(s=>s.trim()).filter(Boolean),cover:draft.cover,gallery:draft.gallery,tags:String(draft.tags||'').split(',').map(s=>s.trim()).filter(Boolean),dr:!!draft.dr,pin:!!draft.pin,date:draft.date||new Date().toLocaleDateString('ru-RU')};try{localStorage.removeItem(dk())}catch(_){}if(o.pin)S.items.forEach(i=>i.pin=false);
    if(draft.isNew)S.items.unshift(o);else S.items=S.items.map(i=>i.id===o.id?o:i);
    await send(el);
  }
});
async function send(btn){
  if(busy)return;busy=true;btn.disabled=true;say('Публикую…');
  try{await persist()}catch(err){sv();busy=false;btn.disabled=false;
    say(err&&err.code==='conflict'?'Кто-то опубликовал одновременно с тобой. Страница обновится, повтори.':'Ошибка публикации: '+(err&&err.code||err&&err.message||err))}
}
const HASH='off';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function upgrade(){const g=async n=>{try{return await claude.use(n)}catch(_){return null}};assets=await g('assets');artifact=await g('artifact');dl=await g('downloads');canPost=role==='admin';render()}
async function tryPw(){const v=document.getElementById('pwi').value;let h='';try{h=await sha(v)}catch(_){}
  if(h===HASH){role='admin';try{localStorage.setItem('vm_adm',HASH);sessionStorage.setItem('vm_role','admin')}catch(_){}render();upgrade()}
  else document.getElementById('gm').textContent='Неверный пароль.'}
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pwi')tryPw()});
try{if(localStorage.getItem('vm_adm')===HASH)role='admin';else if(sessionStorage.getItem('vm_role')==='viewer')role='viewer'}catch(_){}
if(S.pub&&!role)role='viewer';hc();addEventListener('hashchange',()=>{hc();if(role)render()});render();
if(role==='admin')upgrade();
</script>


</body></html>
